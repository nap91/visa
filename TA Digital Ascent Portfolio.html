tyle=\"margin:0;width:1600px;font-size:32px;line-height:1.4;letter-spacing:-0.3px;text-wrap:pretty\">My key Ascent feature-development contributions spanned five interconnected capabilities: <strong style=\"font-weight:600\">Audience, Behavior, Paid Marketing Activities, Conversions and Acquisition.<\u002Fstrong><\u002Fp>\n\n    <sc-raw-table style=\"width:1752px;border-collapse:collapse;table-layout:fixed\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th style=\"width:420px;text-align:left;padding:0 32px 18px 0;border-bottom:2px solid #131313;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Feature<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;padding:0 32px 18px 0;border-bottom:2px solid #131313;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Business capability<\u002Fsc-raw-th>\n          <sc-raw-th style=\"width:440px;text-align:left;padding:0 0 18px 32px;border-bottom:2px solid #131313;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">My contribution depth<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;vertical-align:top\">Audience<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Enables alteration of shipping and advertising approaches based on audience location and characteristics<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 0 22px 32px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top;font-weight:600\">Deepest<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;vertical-align:top\">Behavior<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Identifies which parts of a site drive engagement and conversion<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 0 22px 32px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Deep<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;vertical-align:top\">Paid Marketing Activities<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Determines return on investment for paid campaigns<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 0 22px 32px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Deep<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;vertical-align:top\">Conversions<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Identifies which discounts and offers appeal to existing customers<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 0 22px 32px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Substantial — data and measurement side<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;vertical-align:top\">Acquisition<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 32px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Establishes how visitors found the site and arrived<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:22px 0 22px 32px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Substantial — data and integration side<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div style=\"font-size:20px;line-height:1.4;color:#777777\">Source: TA Digital Ascent – Navdeep<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">32<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"33 — Audience\" data-screen-label=\"33\" data-speaker-notes=\"Audience: what I did, what made it difficult, how I acquired it, and why it is not quickly transferable.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Component and Feature Contribution<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Audience<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:196px;width:1752px;display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:40px;align-items:start\">\n    <div>\n      <div style=\"border-top:2px solid #131313;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What I did<\u002Fdiv>\n      <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Designed and supported audience-related data flows across Ascent · integrated online behavioural with offline transactional information · centralised and standardised customer data from multiple sources · supported creation of a unified customer view across devices and touchpoints · worked with known and unknown identifiers · reviewed merge policies governing how data was prioritised into a unified profile · supported segmentation and audience qualification · supported activation into personalization and marketing capabilities · applied data-governance and privacy controls · validated whether resulting profiles and audiences represented the intended source information.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"border-top:2px solid #FF532C;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What made it difficult<\u002Fdiv>\n      <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Creating an audience in a product interface is not the difficult part. The complexity was understanding how Ascent moved, normalised, reconciled and activated customer data across multiple integrated systems — and knowing that a change could affect source mappings, identity resolution, profile precedence, unified profiles, audience qualification, personalization, analytics, campaign activation and governance simultaneously.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"border-top:2px solid #131313;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">How I acquired it<\u002Fdiv>\n      <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Sustained hands-on work: studying the existing Ascent architecture · working with codebases and configurations · integrations · customization · data processing · debugging · ingestion diagnostics · source-to-CDP validation · merge-policy review · code review · unit testing · client-specific solution design · technical documentation · repeated implementation and troubleshooting.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"border-top:2px solid #FF532C;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Why it is not quickly transferable<\u002Fdiv>\n      <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">An experienced Adobe engineer can learn how an individual Adobe feature works. Knowing how TA Digital Ascent configured and connected those technologies, why specific architectural decisions existed, which dependencies had to be protected, how customizations were implemented and how failures propagated across the ecosystem is a different body of knowledge — acquired progressively across approximately 27 months of direct full-time experience.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">33<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"34 — Behavior\" data-screen-label=\"34\" data-speaker-notes=\"Behavioural measurement crossed several layers; a technically valid value at one layer could still create a semantically incorrect result downstream.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Component and Feature Contribution<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Behavior<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:196px;width:1752px;display:flex;flex-direction:column;gap:36px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;column-gap:40px;align-items:start\">\n      <div>\n        <div style=\"border-top:2px solid #131313;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What I did<\u002Fdiv>\n        <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Created, managed and enforced analytics tagging standards · developed and customised tracking solutions · worked with the page and application data layer · validated events and data elements · validated values passed into analytics variables · supported Adobe Analytics and Customer Journey Analytics capabilities · tracked and analysed web and mobile behaviour · worked with behavioural data ingestion · developed reporting and KPI capabilities · supported multi-tenant analytics and reporting · performed QA, testing and debugging · connected behavioural data to audiences and personalization.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"border-top:2px solid #FF532C;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What made it difficult<\u002Fdiv>\n        <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Behavioural measurement crossed several layers. A technically valid value at one layer could still create a semantically incorrect result downstream. The specialized knowledge was knowing the entire Ascent chain well enough to determine where a problem actually originated, and what downstream functionality it could affect.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 32px 1fr 32px 1fr 32px 1fr 32px 1fr 32px 1fr 32px 1fr;align-items:stretch\">\n      <div style=\"background:#F2F5F6;padding:18px 14px;box-sizing:border-box;display:flex;align-items:center;min-height:112px;font-size:24px;line-height:1.25\">application / content<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:18px 14px;box-sizing:border-box;display:flex;align-items:center;min-height:112px;font-size:24px;line-height:1.25\">data layer<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:18px 14px;box-sizing:border-box;display:flex;align-items:center;min-height:112px;font-size:24px;line-height:1.25\">events &amp; data elements<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:18px 14px;box-sizing:border-box;display:flex;align-items:center;min-height:112px;font-size:24px;line-height:1.25\">collection / tagging<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:18px 14px;box-sizing:border-box;display:flex;align-items:center;min-height:112px;font-size:24px;line-height:1.25\">analytics &amp; CDP<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:18px 14px;box-sizing:border-box;display:flex;align-items:center;min-height:112px;font-size:24px;line-height:1.25\">profile &amp; audience<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:18px 14px;box-sizing:border-box;display:flex;align-items:center;min-height:112px;font-size:24px;line-height:1.25\">personalization &amp; reporting<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"border-top:2px solid #131313;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">How I acquired it<\u002Fdiv>\n      <p style=\"margin:18px 0 0 0;width:1600px;font-size:24px;line-height:1.45;text-wrap:pretty\">Repeated hands-on design, tagging, integration, implementation, testing, debugging, code review and client customization within Ascent.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">34<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"35 — Paid Marketing Activities\" data-screen-label=\"35\" data-speaker-notes=\"Paid marketing was not isolated from the rest of Ascent.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Component and Feature Contribution<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Paid Marketing Activities<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:196px;width:1752px;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;column-gap:40px;align-items:start\">\n      <div>\n        <div style=\"border-top:2px solid #131313;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What I did<\u002Fdiv>\n        <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Supported paid-marketing measurement · worked with campaign and channel data · supported return-on-investment measurement · integrated marketing and behavioural data · worked with campaign and acquisition tagging · supported audience activation and retargeting · connected online and offline data · integrated data into the wider Marketing Data Stack · supported analytics, reporting and campaign performance analysis · worked with Adobe technologies supporting targeting, personalization and engagement · supported keyword and search optimization capabilities within the Ascent responsibility set.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"border-top:2px solid #FF532C;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What made it difficult<\u002Fdiv>\n        <p style=\"margin:18px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Paid marketing was not isolated from the rest of Ascent. It depended on the relationship among acquisition data, behavioural data, profile and audience information, content, commerce, conversion events, personalization, campaign data, and analytics and reporting. Maintaining measurement consistency across those systems required understanding the integrated Ascent architecture rather than any single advertising or analytics product.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"border-top:2px solid #131313;padding-top:16px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">How I acquired it<\u002Fdiv>\n      <p style=\"margin:18px 0 0 0;width:1600px;font-size:24px;line-height:1.45;text-wrap:pretty\">Repeated implementation, integration, measurement, debugging, audience work and technical solutioning across the Ascent marketing-data ecosystem.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">35<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"36 — Conversions and Acquisition\" data-screen-label=\"36\" data-speaker-notes=\"How conversion and acquisition data moved through Ascent's integrated architecture, and what depended on it downstream.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Component and Feature Contribution<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Conversions and Acquisition<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:224px;width:1752px;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:stretch\">\n      <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Conversions<\u002Fdiv>\n        <p style=\"margin:32px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Key development contributions from the data, measurement and personalization side: understanding and implementing how conversion behaviour was captured · validating conversion-related data · connecting outcomes with audience and customer information · supporting KPI measurement · enabling the data required to understand which offers, promotions and experiences drove desired outcomes.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Acquisition<\u002Fdiv>\n        <p style=\"margin:32px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Key development contributions from the data, tracking, analytics and integration side: understanding how visitors arrived at the experience · capturing acquisition and source information · integrating that data into the analytics architecture · ensuring it could subsequently be used in behavioural, conversion, audience and paid-marketing analysis.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:0;width:1600px;font-size:24px;line-height:1.5;color:#777777;text-wrap:pretty\">The relevant knowledge in both cases is not the individual measurement technique. It is how conversion and acquisition data moved through Ascent’s integrated architecture and what depended on it downstream.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">36<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"06 — Section break\" data-screen-label=\"S6 divider\" data-speaker-notes=\"Section six: technical review and approval authority.\" style=\"background:#131313;color:#FFFFFF;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"d7a9bd38-27f5-4435-9863-b6771689ec61\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FFFFFF\">Technical Review and Approval Authority<\u002Fdiv>\n  <div style=\"position:absolute;right:84px;top:60px;font-size:132px;line-height:1;letter-spacing:-3px;font-weight:600;color:#FF532C\">06<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;bottom:150px;width:1500px;margin:0;font-size:176px;line-height:0.98;letter-spacing:-4px;font-weight:600;color:#FFFFFF;text-wrap:pretty\">Technical Review and Approval Authority<\u002Fh2>\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"37 — Review authority\" data-screen-label=\"37\" data-speaker-notes=\"Recurring quality gates within Ascent development, maintenance, customization, code review and release activity.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Technical Review and Approval Authority<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Review authority<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:204px;width:1752px;display:flex;flex-direction:column;gap:44px\">\n    <p style=\"margin:0;width:1600px;font-size:32px;line-height:1.4;letter-spacing:-0.3px;text-wrap:pretty\">As part of my Ascent responsibilities, I reviewed the work of other engineers and held authority to approve or reject technical work for deployment based on defined quality and validation standards. Reviews spanned Adobe Experience Platform, Adobe Analytics and the Ascent web application eCommerce functions.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:36px\">\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-size:32px;line-height:1;color:#777777\">roughly<\u002Fspan><span style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600\">15%<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:24px;font-size:28px;line-height:1.35\">Code quality management<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600\">65%<\u002Fdiv>\n        <div style=\"margin-top:24px;font-size:28px;line-height:1.35\">Client consulting services<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600\">20%<\u002Fdiv>\n        <div style=\"margin-top:24px;font-size:28px;line-height:1.35\">Internal system development<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:0;width:1600px;font-size:24px;line-height:1.5;color:#777777;text-wrap:pretty\">— each of the three utilising TA Digital Ascent.<\u002Fp>\n\n    <p style=\"margin:0;width:1600px;font-size:24px;line-height:1.5;text-wrap:pretty\">These were <strong style=\"font-weight:600\">recurring quality gates<\u002Fstrong> within Ascent development, maintenance, customization, code review and release activity — not isolated one-time exercises.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">37<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"38 — The five review procedures\" data-screen-label=\"38\" data-speaker-notes=\"Five defined review procedures and what each protects.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Technical Review and Approval Authority<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">The five review procedures<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:236px;width:1752px;display:flex;flex-direction:column;gap:36px\">\n    <sc-raw-table style=\"width:1752px;border-collapse:collapse;table-layout:fixed\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th style=\"width:90px;text-align:left;padding:0 24px 18px 0;border-bottom:2px solid #131313;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">#<\u002Fsc-raw-th>\n          <sc-raw-th style=\"width:760px;text-align:left;padding:0 40px 18px 0;border-bottom:2px solid #131313;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Procedure<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;padding:0 0 18px 40px;border-bottom:2px solid #131313;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What it protects<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:26px 24px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;color:#FF532C;vertical-align:top\">1<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 40px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.35;font-weight:600;vertical-align:top\">Data-ingestion error diagnostics<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 0 26px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">Correctness of source-to-destination field mapping<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:26px 24px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;color:#FF532C;vertical-align:top\">2<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 40px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.35;font-weight:600;vertical-align:top\">Source-to-CDP / data-lake sanity testing<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 0 26px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">That code and configuration changes function without introducing defects<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:26px 24px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;color:#FF532C;vertical-align:top\">3<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 40px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.35;font-weight:600;vertical-align:top\">Merge-policy review<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 0 26px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">That profile precedence produces the intended customer representation<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:26px 24px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;color:#FF532C;vertical-align:top\">4<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 40px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.35;font-weight:600;vertical-align:top\">Target / content-variation validation<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 0 26px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">That content variations target audiences correctly<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:26px 24px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.3;font-weight:600;color:#FF532C;vertical-align:top\">5<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 40px 26px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:28px;line-height:1.35;font-weight:600;vertical-align:top\">Events / data-elements / data-layer validation<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:26px 0 26px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.45;vertical-align:top\">That analytics variables are populated correctly, subject to governance standards<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div style=\"font-size:20px;line-height:1.4;color:#777777\">Source: TA Digital Ascent – Navdeep<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">38<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"39 — Procedures 1 and 2\" data-screen-label=\"39\" data-speaker-notes=\"Ingestion error diagnostics and source-to-CDP sanity testing in detail.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Technical Review and Approval Authority<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Procedures 1 and 2 in detail<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:248px;width:1752px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:stretch\">\n    <div style=\"background:#F2F5F6;padding:56px;box-sizing:border-box\">\n      <div style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600;color:#FF532C\">1<\u002Fdiv>\n      <div style=\"margin-top:28px;font-size:38px;line-height:1.25;letter-spacing:-0.6px;font-weight:600\">Data-ingestion error diagnostics<\u002Fdiv>\n      <p style=\"margin:32px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Diagnosing incorrect mappings between source and destination, and investigating why expected source values were not appearing correctly downstream. Requires knowledge of Ascent’s own source mappings and integration patterns, not only of the destination platform’s behaviour.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:56px;box-sizing:border-box\">\n      <div style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600;color:#FF532C\">2<\u002Fdiv>\n      <div style=\"margin-top:28px;font-size:38px;line-height:1.25;letter-spacing:-0.6px;font-weight:600\">Source-to-CDP / data-lake sanity testing<\u002Fdiv>\n      <p style=\"margin:32px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Comparing source information against downstream CDP and data-lake data to determine whether code or configuration changes were functioning correctly and without introducing defects. Requires knowing what the correct downstream representation should be for that particular Ascent implementation.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">39<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"40 — Procedures 3, 4 and 5\" data-screen-label=\"40\" data-speaker-notes=\"Merge-policy review, content-variation validation, and events/data-elements/data-layer validation.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Technical Review and Approval Authority<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Procedures 3, 4 and 5 in detail<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:248px;width:1752px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px;align-items:stretch\">\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box\">\n      <div style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600;color:#FF532C\">3<\u002Fdiv>\n      <div style=\"margin-top:28px;font-size:32px;line-height:1.25;letter-spacing:-0.4px;font-weight:600\">Merge-policy review<\u002Fdiv>\n      <p style=\"margin:28px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">Reviewing how data was prioritised when building unified customer profiles, and evaluating whether profile precedence produced the intended customer representation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box\">\n      <div style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600;color:#FF532C\">4<\u002Fdiv>\n      <div style=\"margin-top:28px;font-size:32px;line-height:1.25;letter-spacing:-0.4px;font-weight:600\">Target / content-variation validation<\u002Fdiv>\n      <p style=\"margin:28px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">Validating content code and configuration across the variations required to target audiences correctly.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box\">\n      <div style=\"font-size:96px;line-height:1;letter-spacing:-2px;font-weight:600;color:#FF532C\">5<\u002Fdiv>\n      <div style=\"margin-top:28px;font-size:32px;line-height:1.25;letter-spacing:-0.4px;font-weight:600\">Events / data-elements / data-layer validation<\u002Fdiv>\n      <p style=\"margin:28px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">Inspecting events, data elements and page data-layer values; confirming they populated analytics variables correctly; conducting overall health checks subject to applicable data-governance standards.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">40<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"41 — The deployment review rule\" data-screen-label=\"41\" data-speaker-notes=\"Work could not be approved for deployment when a critical quality gate failed.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Technical Review and Approval Authority<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">The deployment review rule<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:196px;width:1752px;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"background:#131313;color:#FFFFFF;padding:44px 48px;box-sizing:border-box\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">The operative rule<\u002Fdiv>\n      <p style=\"margin:24px 0 0 0;font-size:38px;line-height:1.3;letter-spacing:-0.6px;font-weight:600;text-wrap:pretty\">Work could not be approved for deployment when a critical quality gate failed.<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">How the rule operated<\u002Fdiv>\n      <p style=\"margin:18px 0 0 0;width:1600px;font-size:24px;line-height:1.5;text-wrap:pretty\">Where a source-to-destination mapping produced incorrect CDP or data-lake values, deployment was held until the mapping or code was corrected and revalidated.<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Why the rule was strict<\u002Fdiv>\n      <div style=\"margin-top:18px;display:grid;grid-template-columns:1fr 32px 1fr 32px 1fr 32px 1fr 32px 1fr 32px 1fr;align-items:stretch\">\n        <div style=\"background:#F2F5F6;padding:22px 18px;box-sizing:border-box;display:flex;align-items:center;min-height:132px;font-size:24px;line-height:1.3\">incorrect mapping<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n        <div style=\"background:#F2F5F6;padding:22px 18px;box-sizing:border-box;display:flex;align-items:center;min-height:132px;font-size:24px;line-height:1.3\">contaminated profile<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n        <div style=\"background:rgba(19,19,19,0.10);padding:22px 18px;box-sizing:border-box;display:flex;align-items:center;min-height:132px;font-size:24px;line-height:1.3\">incorrect audience qualification<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n        <div style=\"background:rgba(19,19,19,0.20);padding:22px 18px;box-sizing:border-box;display:flex;align-items:center;min-height:132px;font-size:24px;line-height:1.3\">wrong personalization delivered<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n        <div style=\"background:#131313;color:#FFFFFF;padding:22px 18px;box-sizing:border-box;display:flex;align-items:center;min-height:132px;font-size:24px;line-height:1.3\">distorted reporting<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;font-size:26px;color:#FF532C\">→<\u002Fdiv>\n        <div style=\"background:#131313;color:#FF532C;padding:22px 18px;box-sizing:border-box;display:flex;align-items:center;min-height:132px;font-size:24px;line-height:1.3;font-weight:600\">governance exposure<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:0;width:1600px;font-size:24px;line-height:1.5;color:#777777;text-wrap:pretty\">Bad data does not stay where it starts. In an integrated architecture the cost of admitting it rises at every subsequent layer, which is why the authority to hold a deployment sat with someone who understood the whole chain.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">41<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"07 — Section break\" data-screen-label=\"S7 divider\" data-speaker-notes=\"Section seven: why this knowledge is advanced.\" style=\"background:#131313;color:#FFFFFF;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"d7a9bd38-27f5-4435-9863-b6771689ec61\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FFFFFF\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <div style=\"position:absolute;right:84px;top:60px;font-size:132px;line-height:1;letter-spacing:-3px;font-weight:600;color:#FF532C\">07<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;bottom:150px;width:1500px;margin:0;font-size:176px;line-height:0.98;letter-spacing:-4px;font-weight:600;color:#FFFFFF;text-wrap:pretty\">Why This Knowledge Is Advanced<\u002Fh2>\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"42 — The question\" data-screen-label=\"42\" data-speaker-notes=\"The question this section answers.\" style=\"background:#F2F5F6;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">The question<\u002Fh2>\n\n  <p style=\"position:absolute;left:84px;top:340px;width:1600px;margin:0;font-size:88px;line-height:1.18;letter-spacing:-2px;font-weight:600;text-wrap:pretty\">What could I do that an engineer with general Adobe expertise could not immediately do — and why would a short period of product training not be equivalent?<\u002Fp>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">42<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"43 — Generic versus Ascent-specific\" data-screen-label=\"43\" data-speaker-notes=\"The pivotal contrast: what an experienced Adobe engineer knows, and what Ascent-specific knowledge additionally required.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Generic Adobe knowledge versus Ascent-specific knowledge<\u002Fh2>\n\n  <sc-raw-table style=\"position:absolute;left:84px;top:212px;width:1752px;border-collapse:collapse;table-layout:fixed\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"width:836px;text-align:left;padding:0 40px 18px 0;border-bottom:2px solid #131313;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#777777\">An experienced Adobe engineer knows<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left;padding:0 0 18px 40px;border-bottom:2px solid #FF532C;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Ascent-specific knowledge additionally required<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:22px 40px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;color:#777777;vertical-align:top\">How to configure a merge policy<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:22px 0 22px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;vertical-align:top;background:#F2F5F6\">Which precedence <em style=\"font-style:italic\">Ascent<\u002Fem> used, why it was chosen, and what breaks when it changes<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:22px 40px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;color:#777777;vertical-align:top\">How to build an audience segment<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:22px 0 22px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;vertical-align:top;background:#F2F5F6\">How Ascent moved, normalised and reconciled the customer data that segment depends on, across three components<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:22px 40px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;color:#777777;vertical-align:top\">How to implement analytics tagging<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:22px 0 22px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;vertical-align:top;background:#F2F5F6\">How Ascent’s data layer, events and data elements were architected, and what downstream profile and activation behaviour they drove<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:22px 40px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;color:#777777;vertical-align:top\">How to read an ingestion error<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:22px 0 22px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;vertical-align:top;background:#F2F5F6\">Where in Ascent’s own integration pattern the mapping originated and what else it affects<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:22px 40px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;color:#777777;vertical-align:top\">How to configure a Target activity<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:22px 0 22px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;vertical-align:top;background:#F2F5F6\">How content variation, audience qualification and measurement interacted within Ascent’s implementation<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:22px 40px 22px 0;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;color:#777777;vertical-align:top\">How individual Adobe products work<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:22px 0 22px 40px;border-bottom:1px solid rgba(19,19,19,0.14);font-size:24px;line-height:1.4;vertical-align:top;background:#F2F5F6\">How this company assembled, connected, customised and operated them as one proprietary solution<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">43<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"44 — Problem · data ingestion mismatch\" data-screen-label=\"44\" data-speaker-notes=\"Representative problem one: data ingestion mismatch.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Representative problem · data ingestion mismatch<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:236px;width:1752px;display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:stretch\">\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 01 · Symptom<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Data existed correctly at source but was missing, incomplete or incorrect downstream.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 02 · Diagnosis<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Trace the ingestion path, mappings, transformations and destination fields; compare source values against the resulting CDP and data-lake values.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 03 · Resolution<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Correct the mapping, configuration or code; rerun the applicable flow; perform source-to-destination sanity validation and regression testing.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#131313;color:#FFFFFF;padding:44px 48px;box-sizing:border-box\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 04 · Why Ascent knowledge was required<\u002Fdiv>\n      <p style=\"margin:24px 0 0 0;width:1600px;font-size:38px;line-height:1.35;letter-spacing:-0.5px;font-weight:600;text-wrap:pretty\">The issue could not be evaluated at the Adobe product level alone. It required knowing how Ascent’s own source mappings and proprietary integration pattern affected profiles, audiences, analytics and personalization downstream.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">44<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"45 — Problem · unified profile and merge policy\" data-screen-label=\"45\" data-speaker-notes=\"Representative problem two: unified profile and merge policy.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Representative problem · unified profile and merge policy<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:236px;width:1752px;display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:stretch\">\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 01 · Symptom<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Multiple customer-data inputs produced an incorrect or inconsistent unified customer representation.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 02 · Diagnosis<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Review the underlying inputs, identifiers and precedence and merge-policy behaviour.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 03 · Resolution<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Correct the applicable prioritisation or merge configuration; revalidate profile and audience outcomes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#131313;color:#FFFFFF;padding:44px 48px;box-sizing:border-box\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 04 · Why Ascent knowledge was required<\u002Fdiv>\n      <p style=\"margin:24px 0 0 0;width:1600px;font-size:38px;line-height:1.35;letter-spacing:-0.5px;font-weight:600;text-wrap:pretty\">The correct decision depended on knowing how Ascent expected customer information from its different integrated sources to resolve, and which downstream functions depended on that resolution.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">45<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"46 — Problem · tracking and targeting inconsistency\" data-screen-label=\"46\" data-speaker-notes=\"Representative problem three: behavioural tracking and targeting inconsistency.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Representative problem · behavioural tracking and targeting inconsistency<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:236px;width:1752px;display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:stretch\">\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 01 · Symptom<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Analytics or personalization results did not match the intended application or customer behaviour.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 02 · Diagnosis<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Trace from application and page → data layer → events and data elements → analytics variables → downstream audience and Target behaviour.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F2F5F6;padding:40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 03 · Resolution<\u002Fdiv>\n        <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.45;text-wrap:pretty\">Correct the relevant data-layer, tagging, event, data-element or content-variation configuration; retest the entire chain.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#131313;color:#FFFFFF;padding:44px 48px;box-sizing:border-box\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Step 04 · Why Ascent knowledge was required<\u002Fdiv>\n      <p style=\"margin:24px 0 0 0;width:1600px;font-size:38px;line-height:1.35;letter-spacing:-0.5px;font-weight:600;text-wrap:pretty\">Troubleshooting required knowledge of the full Ascent integration path, not of Analytics, Launch, Target or AEM independently.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">46<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"47 — Why product training is not equivalent\" data-screen-label=\"47\" data-speaker-notes=\"Five arguments why product training is not equivalent.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Why product training is not equivalent<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:200px;width:1752px;display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:grid;grid-template-columns:80px 1fr;gap:36px;align-items:start;border-top:1px solid rgba(19,19,19,0.14);padding-top:18px\">\n      <div style=\"font-size:48px;line-height:1;letter-spacing:-1px;font-weight:600;color:#FF532C\">1<\u002Fdiv>\n      <div>\n        <div style=\"font-size:32px;line-height:1.3;letter-spacing:-0.3px;font-weight:600\">The knowledge is company-specific, not product-specific.<\u002Fdiv>\n        <p style=\"margin:14px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Product training teaches how Adobe technologies work. It does not teach how one company architected, integrated, customised and operated them together as a proprietary platform.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 1fr;gap:36px;align-items:start;border-top:1px solid rgba(19,19,19,0.14);padding-top:18px\">\n      <div style=\"font-size:48px;line-height:1;letter-spacing:-1px;font-weight:600;color:#FF532C\">2<\u002Fdiv>\n      <div>\n        <div style=\"font-size:32px;line-height:1.3;letter-spacing:-0.3px;font-weight:600\">Much of it is experiential and undocumented.<\u002Fdiv>\n        <p style=\"margin:14px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">The rationale behind architectural decisions, the dependencies that had to be protected, and the failure modes that propagate across components were learned through repeated implementation, debugging and review.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 1fr;gap:36px;align-items:start;border-top:1px solid rgba(19,19,19,0.14);padding-top:18px\">\n      <div style=\"font-size:48px;line-height:1;letter-spacing:-1px;font-weight:600;color:#FF532C\">3<\u002Fdiv>\n      <div>\n        <div style=\"font-size:32px;line-height:1.3;letter-spacing:-0.3px;font-weight:600\">It is cumulative across engagements.<\u002Fdiv>\n        <p style=\"margin:14px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">Ascent was implemented and customised repeatedly for different client requirements. Knowledge of what varies safely and what does not accrued across those implementations.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 1fr;gap:36px;align-items:start;border-top:1px solid rgba(19,19,19,0.14);padding-top:18px\">\n      <div style=\"font-size:48px;line-height:1;letter-spacing:-1px;font-weight:600;color:#FF532C\">4<\u002Fdiv>\n      <div>\n        <div style=\"font-size:32px;line-height:1.3;letter-spacing:-0.3px;font-weight:600\">Breadth is the asset, not any single depth.<\u002Fdiv>\n        <p style=\"margin:14px 0 0 0;font-size:24px;line-height:1.45;text-wrap:pretty\">The specialized capability is the ability to reason across the whole chain — capture, integration, profile, activation, measurement — and locate a problem’s true origin. That is not the sum of five separate product competencies.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 1fr;gap:36px;align-items:start;border-top:1px solid rgba(19,19,19,0.14);padding-top:18px\">\n      <div style=\"font-size:48px;line-height:1;letter-spacing:-1px;font-weight:600;color:#FF532C\">5<\u002Fdiv>\n      <div>\n        <p style=\"margin:0;font-size:32px;line-height:1.3;letter-spacing:-0.3px;text-wrap:pretty\"><strong style=\"font-weight:600\">It was acquired progressively across approximately 27 months<\u002Fstrong> of sustained, direct, full-time experience.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">47<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"48 — Knowledge transfer\" data-screen-label=\"48\" data-speaker-notes=\"The length of the transfer list is itself the point. It is the same list a replacement would have to work through.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Why This Knowledge Is Advanced<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Knowledge transfer<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:180px;width:1752px;display:flex;flex-direction:column;gap:28px\">\n    <p style=\"margin:0;width:1600px;font-size:28px;line-height:1.4;text-wrap:pretty\">A core part of my Ascent responsibility was transferring company-specific implementation knowledge to other team members through technical guidance, enablement, documentation and knowledge sharing.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1130px 1fr;gap:36px;align-items:start\">\n      <div style=\"background:#F2F5F6;padding:36px 40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What had to be transferred<\u002Fdiv>\n        <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">01<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">The Ascent architecture and how its three components interact<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">02<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">The proprietary integration patterns and why they exist<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">03<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Data-layer, tagging and event standards<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">04<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Source-to-destination mapping conventions<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">05<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Identity handling and merge-policy behaviour<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">06<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Customer-profile and audience architecture<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">07<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Personalization and activation configuration<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">08<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Measurement and reporting architecture<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">09<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">The quality and validation procedures applied before deployment<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:32px 14px 1fr;gap:16px;align-items:start\"><div style=\"font-size:22px;line-height:1.5;color:#FF532C;font-weight:700\">10<\u002Fdiv><div style=\"width:14px;height:14px;background:rgba(19,19,19,0.2);margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">What can safely be customised per client and what must not change<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#131313;color:#FFFFFF;padding:36px 40px;box-sizing:border-box\">\n        <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">How it was transferred<\u002Fdiv>\n        <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"font-size:24px;line-height:1.45\">Knowledge-sharing sessions<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.45\">New-hire and team enablement on the Ascent technology stack<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.45\">Senior technical guidance<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.45\">Creation and maintenance of technical and operational documentation<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.45\">Internal technical advisory<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:0;width:1600px;font-size:24px;line-height:1.5;color:#777777;text-wrap:pretty\">The length of that list is itself the point. It is the same list a replacement would have to work through.<\u002Fp>\n  <\u002Fdiv>\n\n  <div st
