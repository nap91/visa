  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"7ef73d84-c479-4be1-b459-64794d2dd61e\"><\u002Fscript>\n<script src=\"66c29007-5609-4d72-a525-a1b097e5bc7e\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n@font-face { font-family: \"SegoeUIFallback\"; src: local(\"Segoe UI\"), local(\"Segoe UI Regular\"); }\nbody { margin: 0; background: #131313; }\na { color: #FF532C; text-decoration: none; }\na:hover { color: #131313; text-decoration: underline; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"1 — Title\" data-screen-label=\"01\" data-speaker-notes=\"Title slide.\" style=\"background:#F2F5F6;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <div style=\"position:absolute;left:84px;top:84px;font-size:28px;line-height:1.3;letter-spacing:-0.2px\">Navdeep Pandey<\u002Fdiv>\n  <h1 style=\"position:absolute;left:84px;top:177px;width:1440px;margin:0;font-size:64px;line-height:1.16;letter-spacing:-1.5px;font-weight:600;text-wrap:pretty\">TA DIGITAL ASCENT<\u002Fh1>\n  <div style=\"position:absolute;left:84px;top:265px;width:1440px;font-size:64px;line-height:1.16;letter-spacing:-1.5px;font-weight:600;text-wrap:pretty\">Specialized Knowledge Technical Portfolio<\u002Fdiv>\n  <img src=\"45119855-bbee-4b1a-8bad-40b16f511e4a\" alt=\"Credera\" style=\"position:absolute;left:84px;top:795px;width:1720px\">\n<\u002Fsection>\n\n<section data-label=\"02 — Section break\" data-screen-label=\"S2 divider\" data-speaker-notes=\"Section two: TA Digital Ascent — what the platform is, what it is made of, and how it was sold and delivered.\" style=\"background:#131313;color:#FFFFFF;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"d7a9bd38-27f5-4435-9863-b6771689ec61\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FFFFFF\">TA Digital Ascent<\u002Fdiv>\n  <div style=\"position:absolute;right:84px;top:60px;font-size:132px;line-height:1;letter-spacing:-3px;font-weight:600;color:#FF532C\">02<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;bottom:150px;width:1365px;margin:0;font-size:176px;line-height:0.98;letter-spacing:-4px;font-weight:600;color:#FFFFFF;text-wrap:pretty\">TA Digital Ascent<\u002Fh2>\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"2 — What Ascent is\" data-screen-label=\"02\" data-speaker-notes=\"Ascent is both a product and a platform. Knowledge of it is not knowledge of any single Adobe application.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">TA Digital Ascent<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">What Ascent is<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:224px;width:800px;background:#F2F5F6;padding:56px 56px 48px 56px;box-sizing:border-box\">\n    <p style=\"margin:0;font-size:30px;line-height:1.42;letter-spacing:-0.3px\">“TA Digital Ascent is both a proprietary product of TA Digital and a proprietary tool used by TA Digital’s employees. It is an eCommerce Web Application based on industry-leading practices… Among the components of TA Digital Ascent are an eCommerce AEM web application, an eCommerce Connector, and a digital marketing connector.”<\u002Fp>\n    <p style=\"margin:36px 0 0 0;font-size:20px;line-height:1.4;color:#777777\">Source: TA Digital Ascent – Navdeep<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:968px;top:224px;width:868px;display:flex;flex-direction:column;gap:32px\">\n    <p style=\"margin:0;font-size:32px;line-height:1.3;letter-spacing:-0.4px;font-weight:600\">Two things follow from that definition, and both matter.<\u002Fp>\n    <p style=\"margin:0;font-size:24px;line-height:1.5;text-wrap:pretty\">Ascent is a <strong style=\"font-weight:600\">product<\u002Fstrong> — a pre-built, company-owned software asset that TA Digital engineers apply and customise to client requirements. It is also a <strong style=\"font-weight:600\">platform<\u002Fstrong> on which fixed-price, fixed-scope packaged offerings are sold.<\u002Fp>\n    <p style=\"margin:0;font-size:24px;line-height:1.5;text-wrap:pretty\">Knowledge of Ascent is therefore not knowledge of any single Adobe application. It is knowledge of how one company assembled, connected, customised and operated many of them as a single proprietary solution.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">2<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"3 — The three components\" data-screen-label=\"03\" data-speaker-notes=\"Three components, one system. A change in any one propagates through the other two.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">TA Digital Ascent<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">The three components<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:224px;width:1752px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px\">\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box;min-height:452px\">\n      <div style=\"width:21px;height:21px;background:#FF532C\"><\u002Fdiv>\n      <h3 style=\"margin:32px 0 0 0;font-size:32px;line-height:1.25;letter-spacing:-0.4px;font-weight:600\">eCommerce AEM Web Application<\u002Fh3>\n      <p style=\"margin:28px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">The customer-facing experience layer, built on Adobe Experience Manager and deployed on Adobe Managed Services, extending Adobe core components with TA Digital’s own accelerator component library<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box;min-height:452px\">\n      <div style=\"width:21px;height:21px;background:#FF532C\"><\u002Fdiv>\n      <h3 style=\"margin:32px 0 0 0;font-size:32px;line-height:1.25;letter-spacing:-0.4px;font-weight:600\">eCommerce Connector<\u002Fh3>\n      <p style=\"margin:28px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">The integration layer moving commerce and customer-interaction data between the storefront, the data platform and downstream systems<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box;min-height:452p  built on TA Digital Ascent was awarded <strong style=\"font-weight:600\">Adobe Accredited Partner Solution<\u002Fstrong> status. Under Adobe’s programme, accredited solutions are market-tested and technically verified by Adobe experts.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:21px 1fr;gap:28px;align-items:start\">\n      <div style=\"width:21px;height:21px;background:#FF532C;margin-top:9px\"><\u002Fdiv>\n      <p style=\"margin:0;font-size:24px;line-height:1.5;text-wrap:pretty\">The company’s Chief Technology Officer stated publicly that Ascent had been serving joint clients with Adobe for several years before I joined the organisation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:21px 1fr;gap:28px;align-items:start\">\n      <div style=\"width:21px;height:21px;background:#FF532C;margin-top:9px\"><\u002Fdiv>\n      <p style=\"margin:0;font-size:24px;line-height:1.5;text-wrap:pretty\">Adobe’s Head of America’s Technical Partner Development, Experience Platform and App Services, was quoted in the same announcement.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:21px 1fr;gap:28px;align-items:start\">\n      <div style=\"width:21px;height:21px;background:#FF532C;margin-top:9px\"><\u002Fdiv>\n      <p style=\"margin:0;font-size:24px;line-height:1.5;text-wrap:pretty\">Ascent was showcased at Adobe Summit as a fixed-price, fixed-scope solution.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"position:absolute;left:84px;top:790px;width:1600px;margin:0;font-size:24px;line-height:1.5;color:#777777;text-wrap:pretty\">Ascent was an established, Adobe-validated, commercially operating platform before I joined. What I acquired after joining was the company-specific knowledge of how it had been architected, integrated, customised and operated.<\u002Fp>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">9<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"03 — Section break\" data-screen-label=\"S3 divider\" data-speaker-notes=\"Section three: my role in Ascent, and how the company-specific knowledge was developed.\" style=\"background:#131313;color:#FFFFFF;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"d7a9bd38-27f5-4435-9863-b6771689ec61\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FFFFFF\">My Ascent Role and Knowledge Development<\u002Fdiv>\n  <div style=\"position:absolute;right:84px;top:60px;font-size:132px;line-height:1;letter-spacing:-3px;font-weight:600;color:#FF532C\">03<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;bottom:150px;width:1500px;margin:0;font-size:176px;line-height:0.98;letter-spacing:-4px;font-weight:600;color:#FFFFFF;text-wrap:pretty\">My Ascent Role and Knowledge Development<\u002Fh2>\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"10 — My role in Ascent\" data-screen-label=\"10\" data-speaker-notes=\"Data Architect. The data layer could not be designed or debugged without understanding the three Ascent components it connected to.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">My Ascent Role and Knowledge Development<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">My role in Ascent<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:224px;width:800px\">\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Position<\u002Fdiv>\n    <p style=\"margin:24px 0 0 0;font-size:38px;line-height:1.25;letter-spacing:-0.6px;font-weight:600\">Data Architect, TA Digital<\u002Fp>\n    <div style=\"margin-top:56px;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">How my role intersected Ascent<\u002Fdiv>\n    <p style=\"margin:24px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">My deepest functional specialization sat in the Data practice — data architecture, analytics, customer data platform, audience, personalization and marketing integration.<\u002Fp>\n    <p style=\"margin:28px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">Ascent itself spanned content, commerce, data, analytics, audience, personalization and marketing technology. My Ascent role was therefore <strong style=\"font-weight:600\">cross-functional by necessity<\u002Fstrong>: the data layer I specialised in could not be designed, changed or debugged without understanding the eCommerce AEM application, the eCommerce Connector and the Digital Marketing Connector it connected to.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:968px;top:224px;width:868px;background:#F2F5F6;padding:48px;box-sizing:border-box\">\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Direct Ascent responsibilities<\u002Fdiv>\n    <div style=\"margin-top:32px;display:flex;flex-wrap:wrap;gap:12px\">\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Maintaining Ascent codebases, rebuilds and customization<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Keeping Ascent current for new capabilities and client requirements<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Ensuring Ascent remained available for demonstration<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Overall project architecture<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Data processing<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Solution design<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">System integration documentation<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Project technology strategy<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Solution and risk barriers<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Code quality and code review<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Unit testing<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Deployment review<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Client customization<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Technical consulting<\u002Fdiv>\n      <div style=\"border:1px solid rgba(19,19,19,0.2);padding:10px 20px;font-size:24px;line-height:1.3\">Pre-sales feasibility, scoping and estimation inputs<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">10<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"11 — What I brought, what I acquired\" data-screen-label=\"11\" data-speaker-notes=\"The pivotal distinction. Industry knowledge versus company-specific knowledge.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">My Ascent Role and Knowledge Development<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">What I brought, and what I had to acquire<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:224px;width:1752px;display:flex;flex-direction:column;gap:40px\">\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:stretch\">\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box;min-height:520px\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">What I brought — industry knowledge<\u002Fdiv>\n      <p style=\"margin:36px 0 0 0;font-size:32px;line-height:1.4;letter-spacing:-0.4px;text-wrap:pretty\">Substantial prior experience in Adobe technologies, digital analytics, data and marketing technology, developed across earlier roles at Adobe and at Visa.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#131313;color:#FFFFFF;padding:48px;box-sizing:border-box;min-height:520px\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">What I had to acquire — company-specific knowledge<\u002Fdiv>\n      <p style=\"margin:36px 0 0 0;font-size:24px;line-height:1.5;text-wrap:pretty\">How TA Digital had <strong style=\"font-weight:600\">architected, integrated, customised, maintained and commercialised<\u002Fstrong> those technologies inside its own proprietary platform:<\u002Fp>\n      <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">the rationale behind Ascent’s proprietary integration patterns<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">how source data was mapped, normalised and reconciled across components<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">how identity and profile precedence were configured, and why<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">which dependencies had to be protected when making a change<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">how failures propagated across the ecosystem<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">how the solution was customised per client without breaking the reusable core<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:0;width:1600px;font-size:24px;line-height:1.5;color:#777777;text-wrap:pretty\">This distinction is the whole point. An experienced Adobe engineer can learn how an individual Adobe feature works. That is a different thing from knowing how Ascent connected them, why particular architectural decisions existed, and what breaks when they change.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:absolute;right:36px;bottom:32px;font-size:15px;color:#777777\">11<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"12 — Stage 1\" data-screen-label=\"12\" data-speaker-notes=\"Stage one: architecture immersion. What the stage focused on, and what I could not yet do.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">My Ascent Role and Knowledge Development<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Stage 1 · Ascent architecture immersion<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:212px;width:1752px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n    <div style=\"background:#131313;color:#FFFFFF;padding:20px 24px;box-sizing:border-box;min-height:104px\"><div style=\"font-size:22px;font-weight:700;letter-spacing:1px;color:#FF532C\">01<\u002Fdiv><div style=\"margin-top:8px;font-size:24px;line-height:1.3\">Ascent architecture immersion<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:20px 24px;box-sizing:border-box;min-height:104px;color:#777777\"><div style=\"font-size:22px;font-weight:700;letter-spacing:1px\">02<\u002Fdiv><div style=\"margin-top:8px;font-size:24px;line-height:1.3\">Hands-on technical specialization<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:20px 24px;box-sizing:border-box;min-height:104px;color:#777777\"><div style=\"font-size:22px;font-weight:700;letter-spacing:1px\">03<\u002Fdiv><div style=\"margin-top:8px;font-size:24px;line-height:1.3\">Advanced cross-functional responsibility<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:20px 24px;box-sizing:border-box;min-height:104px;color:#777777\"><div style=\"font-size:22px;font-weight:700;letter-spacing:1px\">04<\u002Fdiv><div style=\"margin-top:8px;font-size:24px;line-height:1.3\">Subject-matter expertise and knowledge transfer<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;top:376px;width:1060px;background:#F2F5F6;padding:48px;box-sizing:border-box;min-height:520px\">\n    <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">Focus<\u002Fdiv>\n    <div style=\"margin-top:32px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Understanding Ascent as a proprietary product and tool<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Learning its three major components<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Understanding the overall architecture<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Understanding how content, commerce, data, analytics and marketing technologies connected<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">Reviewing existing technical structures, configurations, documentation and codebases<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:# ker-notes=\"The most technically demanding area. Configuring a merge policy is not the difficult part.\" style=\"background:#FFFFFF;color:#131313;font-family:'Segoe UI','SegoeUIFallback',system-ui,sans-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Areas of Advanced Knowledge<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Data Management &amp; Profiling · identity and merge policy<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:224px;width:1752px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:stretch\">\n    <div style=\"background:#F2F5F6;padding:48px;box-sizing:border-box\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase\">The most technically demanding area<\u002Fdiv>\n      <p style=\"margin:28px 0 0 0;font-size:28px;line-height:1.4;text-wrap:pretty\">Building a single, trusted view of a customer from multiple integrated sources required decisions about:<\u002Fp>\n      <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">which identifiers resolve to the same person, and which must not<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">how data is prioritised when sources conflict — merge policy precedence<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">how anonymous activity reconciles to known identity<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">what the resulting unified profile actually represents<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start\"><div style=\"width:14px;height:14px;background:#FF532C;margin-top:11px\"><\u002Fdiv><div style=\"font-size:24px;line-height:1.45\">which downstream functions depend on that resolution being correct<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#131313;color:#FFFFFF;padding:48px;box-sizing:border-box\">\n      <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FF532C\">Why this is Ascent-specific rather than generic<\u002Fdiv>\n      <p style=\"margin:36px 0 0 0;font-size:32px;line-height:1.4;letter-spacing:-0.3px;text-wrap:pretty\">Configuring a merge policy in a product interface is not the difficult part. The difficult part is knowing how <em style=\"font-style:italic\">Ascent<\u002Fem> expected customer information from its particular integrated sources to resolve, why that precedence was chosen, and what breaks when it changes.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  < s-serif;overflow:hidden\">\n  <img src=\"51e7395e-106c-439c-9ca1-d19b3cf24444\" alt=\"Credera\" style=\"position:absolute;left:24px;top:26px;width:36px;height:36px\">\n  <div style=\"position:absolute;left:84px;top:33px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313\">Areas of Advanced Knowledge<\u002Fdiv>\n  <h2 style=\"position:absolute;left:84px;top:80px;width:1600px;margin:0;font-size:52px;line-height:1.1;letter-spacing:-1.5px;font-weight:600\">Data Activation · the dependency problem<\u002Fh2>\n\n  <div style=\"position:absolute;left:84px;top:196px;font-size:28px;line-height:1.4;font-weight:600\">An audience is the visible output of a long chain:<\u002Fdiv>\n\n  <div style=\"position:absolute;left:84px;top:252px;width:1752px;display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr 40px 1fr 40px 1fr;align-items:stretch\">\n    <div style=\"background:#F2F5F6;padding:24px 20px;box-sizing:border-box;display:flex;align-items:center;min-height:116px;font-size:24px;line-height:1.3\">source data<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:center;font-size:28px;color:#FF532C\">→<\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:24px 20px;box-sizing:border-box;display:flex;align-items:center;min-height:116px;font-size:24px;line-height:1.3\">mapping<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:center;font-size:28px;color:#FF532C\">→<\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:24px 20px;box-sizing:border-box;display:flex;align-items:center;min-height:116px;font-size:24px;line-height:1.3\">ingestion<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:center;font-size:28px;color:#FF532C\">→<\u002Fdiv>\n    <div style=\"background:#F2F5F6;padding:24px 20px;box-sizing:border-box;display:flex;align-items:center;min-height:116px;font-size:24px;line-height:1.3\">identity resolution<\u002Fdiv>\n    <div style=\"display:flex;align-it case\">A change anywhere in that chain can alter<\u002Fdiv>\n  <div style=\"position:absolute;left:84px;top:604px;width:1752px;display:flex;flex-wrap:wrap;gap:12px\">\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Source mappings<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Identity resolution<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Profile precedence<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Unified customer profiles<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Audience qualification<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Personalization delivery<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Analytics and reporting<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Campaign activation<\u002Fdiv>\n    <div style=\"border:1px solid rgba(19,19,19,0.2);padding:12px 24px;font-size:24px;line-height:1.3\">Privacy and governance posture<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"position:absolute;left:84px;top:800px;width:1600px;margin:0;font-size:24px;line-height:1.5;color:#777777;text-wrap:pretty\">Understanding those dependencies — not operating any one interface — is what constituted advanced knowledge.<\u002Fp>\n\n  <div style=\"position:absolute;left:84px;bottom:32px;font-size:15px;letter-spacing:0.5px;color:#777777\">Navdeep Pandey · Data Architect<\u002Fdiv>\n  <div style=\"position:absolute;right:83px;bottom:32px;font-size:15px;letter-spacing:1px;color:#777777\">CONFIDENTIAL<\u002Fdiv>\n  <div style=\"position:abs
